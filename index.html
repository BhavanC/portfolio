<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Control Systems Engineer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            position: relative;
            min-height: 100vh;
            width: 100%;
        }
        
        /* ===== EDIT YOUR BACKGROUND IMAGE HERE ===== */
        .background {
            position: absolute;
            inset: 0;
            /* Use the Direct Link from your ImgBB tag */
            background-image: url('https://i.ibb.co/cKDvkkzg/Gemini-Generated-Image-tqgr85tqgr85tqgr.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
        }
        
        .content {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem 3rem;
        }
        
        /* ===== EDIT YOUR PROFILE IMAGE HERE ===== */
        .profile-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        nav {
            display: flex;
            align-items: center;
            gap: 2rem;
        }
        
        nav a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        nav a:hover {
            color: white;
        }
        
        .linkedin-icon {
            width: 20px;
            height: 20px;
        }
        
        .lang-selector {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            cursor: pointer;
        }
        
        /* Hero Section */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 3rem;
        }
        
        .hero {
            text-align: center;
            max-width: 900px;
        }
        
        /* ===== EDIT YOUR TITLE HERE ===== */
        .hero h1 {
            font-size: 3.5rem;
            font-weight: 300;
            color: white;
            line-height: 1.2;
            letter-spacing: 0.02em;
        }
        
        /* ===== EDIT YOUR DESCRIPTION HERE ===== */
        .hero p {
            margin-top: 3rem;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.125rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.7;
            font-weight: 300;
        }
        
        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 3rem;
            padding: 0.875rem 2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            color: white;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s;
        }
        
        .cta-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        /* Scroll Indicator */
        .scroll-indicator {
            padding-bottom: 2rem;
            display: flex;
            justify-content: center;
        }
        
        .scroll-indicator div {
            width: 24px;
            height: 40px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            display: flex;
            justify-content: center;
            padding-top: 8px;
        }
        
        .scroll-indicator span {
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: scroll 1.5s infinite;
        }
        
        @keyframes scroll {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(8px); }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            header {
                padding: 1rem 1.5rem;
            }
            
            .profile-avatar {
                width: 48px;
                height: 48px;
            }
            
            nav {
                gap: 1rem;
            }
            
            nav a span {
                display: none;
            }
            
            main {
                padding: 1rem 1.5rem;
            }
            
            .hero h1 {
                font-size: 2rem;
            }
            
            .hero p {
                font-size: 1rem;
                margin-top: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="background"></div>
        <div class="overlay"></div>
        
        <div class="content">
            <header>
                <!-- ===== EDIT YOUR PROFILE IMAGE URL HERE ===== -->
                <div class="profile-avatar">
                    <img src="https://ibb.co/ymtsCNqk" alt="Profile">
                </div>
                
                <nav>
                    <a href="#contact">Contact</a>
                    
                    <!-- ===== EDIT YOUR LINKEDIN URL HERE ===== -->
                    <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer">
                        <svg class="linkedin-icon" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                        </svg>
                    </a>
                    
                    <div class="lang-selector">
                        <span>🇬🇧</span>
                        <span>English</span>
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </div>
                </nav>
            </header>
            
            <main>
                <div class="hero">
                    <!-- ===== EDIT YOUR TITLE HERE ===== -->
                    <h1>Control Systems Engineer specialised in<br>Digital Twin & MiL</h1>
                    
                    <!-- ===== EDIT YOUR DESCRIPTION HERE ===== -->
                    <p>Master's student with expertise in Model-Based Design and Systems Engineering, developing and validating control algorithms and performing virtual simulations.</p>
                    
                    <a href="#projects" class="cta-button">
                        View My Work
                        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </a>
                </div>
            </main>
            
            <div class="scroll-indicator">
                <div><span></span></div>
            </div>
        </div>
    </div>
</body>
</html>
